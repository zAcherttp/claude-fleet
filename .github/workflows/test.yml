name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: node lib/fleet.mjs --self-test
      - name: fleet runs through its own entry point
        run: node lib/fleet.mjs board --json
        env:
          FLEET_HOME: ${{ runner.temp }}/fleet-home
